spring:
  application:
    name: zyj-voice-shopping
  datasource:
    url: ${VOICE_SHOPPING_DB_URL}
    username: ${VOICE_SHOPPING_DB_USERNAME}
    password: ${VOICE_SHOPPING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai
    open-in-view: false
  data:
    redis:
      host: ${VOICE_SHOPPING_REDIS_HOST}
      port: ${VOICE_SHOPPING_REDIS_PORT:6379}
      password: ${VOICE_SHOPPING_REDIS_PASSWORD}
      database: 3
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "vs:cache:"

# AgentScope + DashScope
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    model-name: qwen-max

# 项目自定义配置
voice-shopping:
  websocket:
    allowed-origins: ${VOICE_SHOPPING_ALLOWED_ORIGINS:}
  llm:
    main-model: qwen-max            # 主对话模型
    light-model: qwen-turbo         # 意图/情感等轻量任务
  embedding:
    model: text-embedding-v3
    dim: 1024
  vector:
    # pgvector 跟随 datasource 所在的那个 PG，实例即 DB 里的 vector 扩展
    # 没有独立的连接参数；默认参数：
    product-topk: 20
    faq-threshold: 0.75
  voice:
    asr-model: paraformer-realtime-v2
    # 模型与音色需成对设置；可通过环境变量覆盖。
    tts-model: ${VOICE_SHOPPING_TTS_MODEL:cosyvoice-v2}
    tts-voice: ${VOICE_SHOPPING_TTS_VOICE:longwan_v2}
  session:
    ttl-minutes: 30
    max-history-turns: 10
  compliance:
    sensitive-word-file: classpath:compliance/sensitive-words.txt
    absolute-claim-patterns: "最好,第一,保证,绝对"
  perspective:
    enabled: true

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000              # 30 天
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-log: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: zyj-voice-shopping

# 日志
logging:
  level:
    com.zhaoyijin.voiceshopping: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
